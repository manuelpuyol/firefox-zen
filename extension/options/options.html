<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zen Folder Tools</title>
  <style>
    :root { color-scheme: light dark; font: menu; font-size: 14px; }
    body { margin: 16px; max-width: 520px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    input[type=number] { width: 70px; }
    .hint { color: GrayText; font-size: 12px; margin: 4px 0 12px; }
    #last { color: GrayText; font-size: 12px; margin-top: 12px; }
  </style>
  <script src="options.js" defer></script>
</head>
<body>
  <h2>Auto-unload</h2>
  <label><input type="checkbox" id="enabled"> Unload tabs I haven't used for a while</label>
  <label>Unload after <input type="number" id="staleMinutes" min="1" max="43200"> minutes unused</label>
  <label>Check every <input type="number" id="scanIntervalMinutes" min="1" max="1440"> minutes</label>
  <p class="hint">Essentials are always kept loaded. The current tab and tabs that are playing audio or still loading are skipped.</p>
  <button id="now" type="button">Unload idle tabs now</button>
  <div id="last"></div>
</body>
</html>
