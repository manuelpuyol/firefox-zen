<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tabs</title>
  <link rel="stylesheet" href="sidebar.css">
  <script src="../lib/settings.js"></script>
  <script src="../lib/model.js"></script>
  <script src="sidebar.js" defer></script>
</head>
<body>
  <div id="essentials" class="essentials"></div>
  <div id="folder-bar" class="separator">
    <span class="line"></span>
    <button id="collapse-all" type="button">Collapse all</button>
  </div>
  <!-- Essentials stay put; everything below scrolls. -->
  <div id="scroll">
  <div id="pinned" class="section"></div>
  <div id="separator" class="separator">
    <span class="line"></span>
    <button id="clear" type="button" title="Close all regular tabs">↓ Clear</button>
  </div>
  <div id="regular" class="section"></div>
  <div class="footer">
    <button id="new-tab" type="button"><span class="plus">+</span> New Tab</button>
    <button id="settings" type="button" title="Zen Folder Tools settings" aria-label="Settings">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"/><circle cx="11" cy="4.5" r="1.5"/><circle cx="5" cy="11.5" r="1.5"/></svg>
    </button>
  </div>
  </div>
</body>
</html>
